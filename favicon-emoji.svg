<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0366d6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#28a745;stop-opacity:1" />
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="45" fill="url(#bg)" stroke="#fff" stroke-width="2"/>
  
  <!-- Emoji (will work better as SVG text) -->
  <text x="50" y="65" font-size="35" text-anchor="middle" fill="white">👨🏿‍💻</text>
</svg>
